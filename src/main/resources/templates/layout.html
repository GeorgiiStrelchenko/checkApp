<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · checkApp'">checkApp</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
        a { color: #38bdf8; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px;
                  background: #1e293b; border-bottom: 1px solid #334155; }
        .navbar .brand { font-weight: 700; font-size: 18px; color: #38bdf8; }
        .navbar .user { display: flex; align-items: center; gap: 12px; color: #94a3b8; }
        .container { max-width: 960px; margin: 0 auto; padding: 24px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        h1 { font-size: 22px; margin: 0 0 16px; }
        h2 { font-size: 16px; margin: 0 0 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #94a3b8; font-weight: 600; }
        input[type=text], input[type=url], input[type=number], input[type=password] {
            width: 100%; padding: 8px 10px; margin: 4px 0 12px; background: #0f172a; color: #e2e8f0;
            border: 1px solid #334155; border-radius: 6px; font-size: 14px;
        }
        label { font-size: 13px; color: #94a3b8; }
        button, .btn { background: #38bdf8; color: #0f172a; border: 0; border-radius: 6px; padding: 8px 14px;
                       font-size: 14px; font-weight: 600; cursor: pointer; }
        button.secondary, .btn.secondary { background: #334155; color: #e2e8f0; }
        button:hover, .btn:hover { filter: brightness(1.1); text-decoration: none; }
        .error { color: #f87171; font-size: 13px; margin: -8px 0 10px; }
        .flash { background: #14532d; border: 1px solid #16a34a; color: #bbf7d0; padding: 10px 14px;
                 border-radius: 8px; margin-bottom: 16px; }
        .flash.error { background: #7f1d1d; border-color: #dc2626; color: #fecaca; margin: 0 0 16px; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .badge.UP { background: #14532d; color: #4ade80; }
        .badge.DOWN { background: #7f1d1d; color: #f87171; }
        .badge.UNKNOWN { background: #334155; color: #94a3b8; }
        .muted { color: #94a3b8; font-size: 13px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .stat { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
        .stat .value { font-size: 20px; font-weight: 700; }
        .stat .label { color: #94a3b8; font-size: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
<div th:fragment="nav">
    <nav class="navbar">
        <a class="brand" th:href="@{/}">checkApp</a>
        <div class="user">
            <span th:text="${username}">user</span>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button class="secondary" type="submit">Logout</button>
            </form>
        </div>
    </nav>
</div>
</body>
</html>
