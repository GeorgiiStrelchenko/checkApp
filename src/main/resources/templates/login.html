<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login')}"></head>
<body>
<div class="container" style="max-width:420px; margin-top:80px">
    <div class="card">
        <h1>Sign in to checkApp</h1>

        <div class="flash error" th:if="${param.error}">Invalid username or password</div>
        <div class="flash" th:if="${param.logout}">You have been logged out</div>
        <div class="flash" th:if="${param.registered}">Registration successful, please sign in</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>

            <button type="submit" style="width:100%">Login</button>
        </form>

        <p class="muted" style="margin-top:16px">
            No account yet? <a th:href="@{/register}">Register</a>
        </p>
    </div>
</div>
</body>
</html>
