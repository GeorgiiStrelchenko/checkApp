spring:
  application:
    name: checkApp
  datasource:
    url: jdbc:postgresql://localhost:5433/checkapp
    username: checkapp
    password: checkapp
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  scheduler:
    enabled: true
    tick-ms: 10000
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
