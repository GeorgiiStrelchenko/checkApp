# ============================================================
# Конфигурация ТЕСТОВ.
#
# Файл лежит в src/test/resources/ и ПОЛНОСТЬЮ ЗАМЕНЯЕТ основной
# application.yml во время тестов (test-classes идут в classpath первыми).
# Поэтому здесь должен быть весь нужный тестам конфиг, а данные источника
# (url/username/password PostgreSQL) задаёт НЕ этот файл, а базовый класс
# PostgresTestSupport через @DynamicPropertySource — там подставляются
# параметры запущенного Testcontainers-контейнера.
# ============================================================

spring:
  test:
    database:
      # "none": Spring НЕ подменяет наш DataSource встроенной тестовой БД
      # (H2/embedded). По умолчанию стоит "any" — и @DataJpaTest подменил бы
      # PostgreSQL на H2, чем свёл бы на нет смысл тестов в реальной БД.
      replace: none

  jpa:
    hibernate:
      # Как и в проде: сверяем схему с БД, ничего не создаём —
      # схему в контейнере накатывает Flyway (см. ниже)
      ddl-auto: validate

  flyway:
    # Миграции работают и в тестах: контейнер пустой, Flyway создаёт схему
    # при первом старте контекста. Повторные контексты миграции пропускает.
    enabled: true

app:
  scheduler:
    # ПЛАНИРОВЩИК В ТЕСТАХ ВЫКЛЮЧЕН: иначе фоновый тик пинговал бы URL
    # между тестами и «мутил» базу (непредсказуемые записи/статусы).
    enabled: false

  telegram:
    # Секретов в тестах нет: сервис работает в режиме заглушки
    # и пишет [telegram-stub] в лог вместо реальных запросов.
    bot-token: ""
    chat-id: ""
