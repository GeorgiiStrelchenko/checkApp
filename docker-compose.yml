services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: checkapp
      POSTGRES_USER: checkapp
      POSTGRES_PASSWORD: checkapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkapp -d checkapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
