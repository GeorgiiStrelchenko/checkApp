services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: checkapp
      POSTGRES_USER: checkapp
      POSTGRES_PASSWORD: checkapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkapp -d checkapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/checkapp
      SPRING_DATASOURCE_USERNAME: checkapp
      SPRING_DATASOURCE_PASSWORD: checkapp
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
